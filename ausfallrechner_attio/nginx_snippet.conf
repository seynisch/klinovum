    # Ausfall-Rechner: Jeder Seitenaufruf wird im Hintergrund an n8n gemeldet (Attio-Vermerk).
    # Die Antwort an den Besucher bleibt unverändert, ein Fehler dort hat keine Wirkung.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /ausfallrechner/index.html {
        mirror /_rechner_open;
        mirror_request_body off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    location = /_rechner_open {
        internal;
        set $n8n_upstream http://n8n-n8n-1:5678;
        proxy_pass $n8n_upstream/webhook/__RECHNER_WEBHOOK_PFAD__$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Klinovum-Secret "__RECHNER_GEHEIMNIS__";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

