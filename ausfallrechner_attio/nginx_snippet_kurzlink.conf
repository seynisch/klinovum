    # Kurzlinks zum Ausfall-Rechner: /r/<code> wird von n8n aufgelöst und leitet auf die Rechner-Seite weiter.
    # Fällt n8n aus, landet der Besucher trotzdem auf der Rechner-Seite (ohne Vorbelegung).
    location ~ "^/r/([a-z0-9]{4,12})$" {
        set $n8n_upstream http://n8n-n8n-1:5678;
        proxy_pass $n8n_upstream/webhook/__RECHNER_KURZLINK_PFAD__?c=$1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_redirect off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
        error_page 502 503 504 =302 /ausfallrechner/;
    }

